<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CodeSpace</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header class="topbar">
<button id="menuBtn" class="icon-btn" aria-label="Меню">☰</button>
<div class="brand">CodeSpace</div>
<button id="settingsBtn" class="icon-btn" aria-label="Настройки">⚙</button>
</header>
<aside id="sideMenu" class="side-menu">
<button data-view="spaces">spaces</button><button data-view="projects">projects</button><button data-view="create-space">create space</button><button data-view="create-project">create project</button>
</aside>
<main id="content"></main><div id="fileAccessBanner" class="file-access hidden"><div><strong>Доступ к файлам</strong><span>Разреши CodeSpace доступ к папке приложения, чтобы сохранять данные на устройстве.</span></div><button id="grantAccess" class="btn">Разрешить доступ</button></div>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button id="closeModal" class="close">×</button></div><div id="modalBody"></div></div></div>
<script src="app.js"></script>
</body></html>
